services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${APP_PORT}:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shop?schema=public
      CI: 'true'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
